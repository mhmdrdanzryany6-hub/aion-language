name: AION checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: node cli.mjs check showcase.ai
      - run: node cli.mjs run showcase.ai
      - run: node cli.mjs build modules-demo.ai demo.aion.json
      - run: node cli.mjs exec demo.aion.json
      - run: node cli.mjs test tests.ai
